{% comment %}
Shared layout for customer emails, matching otp_email.html: grey page, white
card, the PNG logo (Gmail and Outlook do not render SVG) and the brand green.
Styles are inline because most mail clients drop <style> blocks.
{% endcomment %}<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavPrana Organics | {% block title %}{% endblock %}</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f7f7f7; padding: 30px 12px;">
    <div style="max-width: 600px; margin: auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">

        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="{{ site_url }}/static/logos/logo_navprana.png" alt="NavPrana Organics" style="max-width: 150px;">
        </div>

        <!-- Heading -->
        <h2 style="color: #2d6a4f; text-align: center; margin: 0 0 4px;">{% block heading %}{% endblock %}</h2>
        {% if order %}<p style="font-size: 14px; color: #888; text-align: center; margin: 0 0 24px;">Order #{{ order.id }}</p>{% endif %}

        <p style="font-size: 16px; color: #555;">Hi {{ user.first_name|default:"there" }},</p>

        {% block content %}{% endblock %}

        <!-- Footer -->
        <p style="font-size: 14px; color: #555; text-align: center; margin-top: 30px;">
            Regards,<br>
            <b>NavPrana Organics Team</b>
        </p>
        <p style="font-size: 12px; color: #888; text-align: center; margin: 16px 0 0;">
            Questions? Write to us at <a href="mailto:support@navprana.com" style="color: #2d6a4f;">support@navprana.com</a>
        </p>
    </div>
</body>
</html>
